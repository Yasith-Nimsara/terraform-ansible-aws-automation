<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DevOps Project 2 — Terraform + Ansible</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 32px; border-radius: 12px; border: 1px solid #38bdf8; max-width: 520px; text-align: center; }
    h1 { color: #38bdf8; margin-top: 0; }
    .badge { display: inline-block; background: #0284c7; padding: 6px 12px; border-radius: 6px; margin: 4px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Cloud Server Provisioned and Hardened</h1>
    <p>This AWS EC2 instance was built by <strong>Terraform</strong> and configured automatically by <strong>Ansible</strong>.</p>
    <div>
      <span class="badge">SSH Root Disabled</span>
      <span class="badge">UFW Firewall Active</span>
      <span class="badge">Docker + Nginx Live</span>
    </div>
  </div>
</body>
</html>
